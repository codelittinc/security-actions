# Secret scanning. Unlike the dependency scan, this one DOES block:
# a committed credential is a live incident, not an advisory.
#
# Two scans run per invocation:
#   1. git history for the range being pushed (catches newly added secrets)
#   2. the checked-out working tree (catches secrets already sitting in the
#      code from earlier commits, which a range scan alone never sees)
name: Reusable Security Scan

env:
  TRUFFLEHOG_VERSION: "3.90.5"

on:
  workflow_call:
    inputs:
      show_keys:
        description: "Whether to show the keys found by TruffleHog in the output"
        required: false
        default: false
        type: boolean
      notify_webhook:
        description: "Whether to send webhook notifications for security alerts"
        required: false
        default: true
        type: boolean
      ignore_keys:
        description: "Comma-separated list of keys to ignore as false positives (e.g., 'AWS_ACCESS_KEY_ID,API_KEY')"
        required: false
        default: ""
        type: string
      scan_filesystem:
        description: "Also scan the checked-out working tree, not just the pushed commit range"
        required: false
        default: true
        type: boolean
    secrets:
      webhook_url:
        description: "Webhook URL for security alerts"
        required: false

permissions:
  contents: read

jobs:
  # Runs in parallel with secret-scan. It only gates the webhook, which is
  # not needed until the very end, so blocking the scan on it wasted a
  # whole runner start-up.
  validate-inputs:
    name: Validate Required Inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Webhook URL
        env:
          WEBHOOK_URL: ${{ secrets.webhook_url }}
          NOTIFY: ${{ inputs.notify_webhook }}
        run: |
          if [ "$NOTIFY" != "true" ]; then
            echo "ℹ️  Webhook notifications disabled - nothing to validate"
            exit 0
          fi

          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ ERROR: notify_webhook is true but no webhook_url secret was provided"
            exit 1
          fi

          case "$WEBHOOK_URL" in
            http://*|https://*) ;;
            *) echo "❌ ERROR: Invalid webhook URL format - must start with http:// or https://"; exit 1 ;;
          esac

          echo "✅ Webhook URL validation passed"

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No continue-on-error here on purpose. If the scanner cannot be
      # installed the build must fail: previously a failed install produced
      # zero findings, which was reported as "no secrets detected" and let
      # the build pass without anything ever being scanned.
      - name: Install TruffleHog
        run: |
          # TRUFFLEHOG_VERSION comes from the workflow-level env block.
          set -euo pipefail

          BINARY="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          BASE="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"

          echo "🔒 Installing TruffleHog v${TRUFFLEHOG_VERSION}"
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          curl -sSfL -o "$BINARY" "${BASE}/${BINARY}"
          curl -sSfL -o "$CHECKSUMS" "${BASE}/${CHECKSUMS}"

          echo "🔍 Verifying checksum..."
          grep " ${BINARY}\$" "$CHECKSUMS" | sha256sum -c -
          echo "✅ Checksum verified"

          tar -xzf "$BINARY"
          sudo install -m 755 trufflehog /usr/local/bin/trufflehog
          cd / && rm -rf "$TEMP_DIR"

          trufflehog --version
          echo "✅ TruffleHog installed"

      - name: Run TruffleHog scans
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          BEFORE_COMMIT: ${{ github.event.before }}
          SCAN_FILESYSTEM: ${{ inputs.scan_filesystem }}
        run: |
          set -uo pipefail
          : > raw_findings.json

          # --- scan 1: the commit range being pushed -------------------------
          if [ "$CURRENT_BRANCH" = "$DEFAULT_BRANCH" ]; then
            if [ -z "$BEFORE_COMMIT" ] || [ "$BEFORE_COMMIT" = "0000000000000000000000000000000000000000" ]; then
              SINCE_COMMIT="HEAD~1"
            else
              SINCE_COMMIT="$BEFORE_COMMIT"
            fi
            echo "🔍 Push to default branch ($DEFAULT_BRANCH)"
          else
            SINCE_COMMIT="origin/${DEFAULT_BRANCH}"
            echo "🔍 Feature branch - scanning commits not in $DEFAULT_BRANCH"
          fi

          echo "📋 Scanning git history since: $SINCE_COMMIT"
          git log --oneline "${SINCE_COMMIT}..HEAD" 2>/dev/null || echo "(could not list commit range)"

          trufflehog git "file://." \
            --since-commit="$SINCE_COMMIT" \
            --branch=HEAD \
            --no-verification \
            --force-skip-binaries \
            --force-skip-archives \
            --no-update \
            --json \
            >> raw_findings.json 2>/dev/null
          echo "📊 git scan exit code: $?"

          # --- scan 2: the working tree as it stands now ---------------------
          # A range scan only sees what this push touched. Secrets committed
          # before the range are invisible to it, so scan the tree too.
          if [ "$SCAN_FILESYSTEM" = "true" ]; then
            echo "📋 Scanning working tree for pre-existing secrets"
            trufflehog filesystem . \
              --no-verification \
              --force-skip-binaries \
              --force-skip-archives \
              --no-update \
              --json \
              >> raw_findings.json 2>/dev/null
            echo "📊 filesystem scan exit code: $?"
          fi

          # Keep only real findings; drop log lines.
          grep '"SourceMetadata"' raw_findings.json > all_findings.json 2>/dev/null || : > all_findings.json
          rm -f raw_findings.json
          echo "📊 Raw findings: $(wc -l < all_findings.json)"

      - name: Filter and de-duplicate findings
        env:
          IGNORE_KEYS: ${{ inputs.ignore_keys }}
        run: |
          set -uo pipefail

          # The two scans overlap, so the same secret appears twice. Key on
          # detector + raw value only: the git source reports "src/config.ts"
          # while the filesystem source reports "./src/config.ts", so keying
          # on the path as well would fail to collapse the duplicate.
          jq -sc 'unique_by([.DetectorName, .Raw]) | .[]' all_findings.json > deduped.json 2>/dev/null \
            || cp all_findings.json deduped.json

          if [ -n "$IGNORE_KEYS" ]; then
            echo "🚫 Applying ignore list"
            # Drop any finding whose raw value contains an ignored key
            # (case-insensitive), matching the previous behaviour.
            jq -c --arg keys "$IGNORE_KEYS" '
              ($keys | split(",") | map(ascii_downcase | gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ignore
              | select([ $ignore[] as $k | ((.Raw // "") | ascii_downcase | contains($k)) ] | any | not)
            ' deduped.json > findings.json 2>/dev/null || cp deduped.json findings.json
            echo "🚫 Ignored $(( $(wc -l < deduped.json) - $(wc -l < findings.json) )) finding(s)"
          else
            cp deduped.json findings.json
          fi

          rm -f all_findings.json deduped.json
          echo "COUNT=$(wc -l < findings.json)" >> "$GITHUB_ENV"
          printf "📊 Findings after filtering: %s\n" "$(wc -l < findings.json)"

      - name: Report findings
        if: always()
        env:
          SHOW_KEYS: ${{ inputs.show_keys }}
        run: |
          set -uo pipefail

          if [ ! -s findings.json ]; then
            echo "✅ No secrets detected"
            echo "## ✅ Secret scan: clean" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TOTAL=$(wc -l < findings.json)
          echo "🚨 SECURITY BREACH DETECTED 🚨"
          printf "TruffleHog detected %d potential credential(s).\n\n" "$TOTAL"
          echo "IMMEDIATE ACTION REQUIRED:"
          echo "1. 🔄 Rotate every detected key/secret now - once pushed, treat them as compromised"
          echo "2. 🧹 Remove them from the code and move them to secrets management"
          echo "3. 📝 Remember that rewriting history does not un-leak a pushed credential"
          echo ""
          echo "🔑 Findings:"
          echo "================================"

          # Location fields differ between the git and filesystem sources.
          LOCATION='(.SourceMetadata.Data.Git.file // .SourceMetadata.Data.Filesystem.file // "unknown location")'
          COMMIT='(.SourceMetadata.Data.Git.commit // "" | if . == "" then "" else " (Commit: " + .[0:8] + ")" end)'

          if [ "$SHOW_KEYS" = "true" ]; then
            jq -r ".DetectorName + \" in \" + $LOCATION + $COMMIT + \": \" + (.Raw // \"\")" findings.json \
              || echo "Could not parse findings for display"
          else
            jq -r ".DetectorName + \" in \" + $LOCATION + $COMMIT" findings.json \
              || echo "Could not parse findings for display"
            echo ""
            echo "ℹ️  Key values are hidden. Set show_keys: true to display them."
          fi
          echo "================================"

          {
            echo "## 🚨 Secret scan: $TOTAL finding(s)"
            echo ""
            echo "Rotate the affected credentials immediately."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Security Alert to Webhook
        if: always() && inputs.notify_webhook
        continue-on-error: true
        env:
          SECURITY_WEBHOOK_URL: ${{ secrets.webhook_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ ! -s findings.json ]; then
            echo "No secrets detected - skipping webhook notification"
            exit 0
          fi

          case "${SECURITY_WEBHOOK_URL:-}" in
            http://*|https://*) ;;
            *) echo "ℹ️ No valid webhook URL - skipping notification"; exit 0 ;;
          esac

          # Never send the secret itself to a third-party endpoint.
          jq -c '. + {Raw: "***REDACTED***", RawV2: "***REDACTED***"}' findings.json > sanitized.json

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg workflow_run_url "$RUN_URL" \
            --argjson secrets_count "$(wc -l < findings.json)" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile findings sanitized.json \
            '{repository: $repository, branch: $branch, commit: $commit, actor: $actor,
              workflow_run_url: $workflow_run_url, secrets_count: $secrets_count,
              timestamp: $timestamp, findings: $findings}' > payload.json

          if curl -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Security-Scanner/1.0" \
            -d @payload.json "$SECURITY_WEBHOOK_URL" \
            --max-time 30 --retry 2 --retry-delay 5 \
            --fail-with-body --silent --show-error; then
            echo "✅ Security alert sent"
          else
            echo "❌ Failed to send security alert (exit $?)"
          fi

          rm -f payload.json sanitized.json

      # Blocks the build when secrets are present. Reuses the findings the
      # scan already produced instead of re-running TruffleHog a second time,
      # which is what the previous "final verification" pass did.
      - name: Fail on detected secrets
        if: always()
        run: |
          set -uo pipefail
          if [ -s findings.json ]; then
            printf "🚨 FAILING BUILD: %s secret(s) detected\n" "$(wc -l < findings.json)"
            rm -f findings.json
            exit 1
          fi
          rm -f findings.json
          echo "✅ No secrets detected - build can proceed"

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [validate-inputs, secret-scan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check scan results
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          VALIDATE_RESULT: ${{ needs.validate-inputs.result }}
        run: |
          if [ "$VALIDATE_RESULT" = "failure" ]; then
            echo "❌ Build blocked: input validation failed"
            exit 1
          fi

          if [ "$SECRET_SCAN_RESULT" != "success" ]; then
            echo "❌ Build blocked: secret scan result was '$SECRET_SCAN_RESULT'"
            echo "   (a failed or errored scan blocks too - an unrun scan is not a pass)"
            exit 1
          fi

          echo "✅ No secrets detected - build is secure"
