# Secret scanning. Unlike the dependency scan, this one DOES block - but only
# on secrets the pushed commits actually introduce. A newly committed
# credential is a live incident; a string already sitting in the codebase is
# not something the next PR can fix, and rotating the key does not remove it
# from the file. Blocking on those would wedge every future PR.
#
#   scan 1 (always)  git history for the range being pushed  -> BLOCKS
#   scan 2 (opt-in)  the checked-out working tree            -> ADVISORY ONLY
#
# Enable scan 2 with scan_filesystem: true for visibility into pre-existing
# secrets without gating merges on them.
name: Reusable Security Scan

env:
  TRUFFLEHOG_VERSION: "3.96.0"

on:
  workflow_call:
    inputs:
      show_keys:
        description: "Whether to show the keys found by TruffleHog in the output"
        required: false
        default: false
        type: boolean
      notify_webhook:
        description: "Whether to send webhook notifications for security alerts"
        required: false
        default: true
        type: boolean
      ignore_keys:
        description: "Comma-separated list of keys to ignore as false positives (e.g., 'AWS_ACCESS_KEY_ID,API_KEY')"
        required: false
        default: ""
        type: string
      scan_filesystem:
        description: >-
          Additionally scan the whole working tree for pre-existing secrets.
          These findings are ADVISORY ONLY and never fail the build - a secret
          already in the codebase cannot be fixed by the PR that trips over it,
          and once rotated the string usually still sits in the file. Only
          secrets introduced by the commits being pushed block.
        required: false
        default: false
        type: boolean
    secrets:
      webhook_url:
        description: "Webhook URL for security alerts"
        required: false

permissions:
  contents: read

jobs:
  # Runs in parallel with secret-scan. It only gates the webhook, which is
  # not needed until the very end, so blocking the scan on it wasted a
  # whole runner start-up.
  validate-inputs:
    name: Validate Required Inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Webhook URL
        env:
          WEBHOOK_URL: ${{ secrets.webhook_url }}
          NOTIFY: ${{ inputs.notify_webhook }}
        run: |
          if [ "$NOTIFY" != "true" ]; then
            echo "ℹ️  Webhook notifications disabled - nothing to validate"
            exit 0
          fi

          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ ERROR: notify_webhook is true but no webhook_url secret was provided"
            exit 1
          fi

          case "$WEBHOOK_URL" in
            http://*|https://*) ;;
            *) echo "❌ ERROR: Invalid webhook URL format - must start with http:// or https://"; exit 1 ;;
          esac

          echo "✅ Webhook URL validation passed"

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No continue-on-error here on purpose. If the scanner cannot be
      # installed the build must fail: previously a failed install produced
      # zero findings, which was reported as "no secrets detected" and let
      # the build pass without anything ever being scanned.
      - name: Install TruffleHog
        run: |
          # TRUFFLEHOG_VERSION comes from the workflow-level env block.
          set -euo pipefail

          BINARY="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          BASE="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"

          echo "🔒 Installing TruffleHog v${TRUFFLEHOG_VERSION}"
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          curl -sSfL -o "$BINARY" "${BASE}/${BINARY}"
          curl -sSfL -o "$CHECKSUMS" "${BASE}/${CHECKSUMS}"

          echo "🔍 Verifying checksum..."
          grep " ${BINARY}\$" "$CHECKSUMS" | sha256sum -c -
          echo "✅ Checksum verified"

          tar -xzf "$BINARY"
          sudo install -m 755 trufflehog /usr/local/bin/trufflehog
          cd / && rm -rf "$TEMP_DIR"

          trufflehog --version
          echo "✅ TruffleHog installed"

      - name: Run TruffleHog scans
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          BEFORE_COMMIT: ${{ github.event.before }}
          SCAN_FILESYSTEM: ${{ inputs.scan_filesystem }}
        run: |
          set -uo pipefail
          : > raw_findings.json

          # --- scan 1: the commit range being pushed -------------------------
          if [ "$CURRENT_BRANCH" = "$DEFAULT_BRANCH" ]; then
            if [ -z "$BEFORE_COMMIT" ] || [ "$BEFORE_COMMIT" = "0000000000000000000000000000000000000000" ]; then
              SINCE_COMMIT="HEAD~1"
            else
              SINCE_COMMIT="$BEFORE_COMMIT"
            fi
            echo "🔍 Push to default branch ($DEFAULT_BRANCH)"
          else
            SINCE_COMMIT="origin/${DEFAULT_BRANCH}"
            echo "🔍 Feature branch - scanning commits not in $DEFAULT_BRANCH"
          fi

          echo "📋 Scanning git history since: $SINCE_COMMIT"
          git log --oneline "${SINCE_COMMIT}..HEAD" 2>/dev/null || echo "(could not list commit range)"

          trufflehog git "file://." \
            --since-commit="$SINCE_COMMIT" \
            --branch=HEAD \
            --no-verification \
            --force-skip-binaries \
            --force-skip-archives \
            --no-update \
            --json \
            >> raw_findings.json 2>/dev/null
          echo "📊 git scan exit code: $?"

          # --- scan 2: the working tree as it stands now ---------------------
          # A range scan only sees what this push touched. Secrets committed
          # before the range are invisible to it, so scan the tree too.
          if [ "$SCAN_FILESYSTEM" = "true" ]; then
            echo "📋 Scanning working tree for pre-existing secrets"
            trufflehog filesystem . \
              --no-verification \
              --force-skip-binaries \
              --force-skip-archives \
              --no-update \
              --json \
              >> raw_findings.json 2>/dev/null
            echo "📊 filesystem scan exit code: $?"
          fi

          # Keep only real findings; drop log lines.
          grep '"SourceMetadata"' raw_findings.json > all_findings.json 2>/dev/null || : > all_findings.json
          rm -f raw_findings.json
          echo "📊 Raw findings: $(wc -l < all_findings.json)"

      - name: Filter and de-duplicate findings
        env:
          IGNORE_KEYS: ${{ inputs.ignore_keys }}
        run: |
          set -uo pipefail

          # Split by source before anything else. Git-source findings come
          # from the commits being pushed and are the only ones that block.
          # Filesystem-source findings are pre-existing content: the PR that
          # trips over them did not introduce them and usually cannot remove
          # them, and after a key is rotated the old string is still sitting
          # in the file - so blocking on those would wedge every future PR.
          jq -c 'select(.SourceMetadata.Data.Git != null)'  all_findings.json > git_raw.json 2>/dev/null || : > git_raw.json
          jq -c 'select(.SourceMetadata.Data.Git == null)'  all_findings.json > fs_raw.json  2>/dev/null || : > fs_raw.json

          # Drop findings whose raw value contains an ignored key (case-insensitive).
          apply_filters() {
            IN="$1"; OUT="$2"
            jq -sc 'unique_by([.DetectorName, .Raw]) | .[]' "$IN" > "$OUT.dedup" 2>/dev/null || cp "$IN" "$OUT.dedup"
            if [ -n "$IGNORE_KEYS" ]; then
              jq -c --arg keys "$IGNORE_KEYS" '
                ($keys | split(",") | map(ascii_downcase | gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ignore
                | select([ $ignore[] as $k | ((.Raw // "") | ascii_downcase | contains($k)) ] | any | not)
              ' "$OUT.dedup" > "$OUT" 2>/dev/null || cp "$OUT.dedup" "$OUT"
            else
              cp "$OUT.dedup" "$OUT"
            fi
            rm -f "$OUT.dedup"
          }

          apply_filters git_raw.json blocking.json
          apply_filters fs_raw.json advisory_all.json

          # A secret found by both scans was introduced by this push, so it is
          # already in blocking.json - do not also report it as advisory.
          if [ -s blocking.json ] && [ -s advisory_all.json ]; then
            jq -sc --slurpfile blocking blocking.json '
              ($blocking | map([.DetectorName, .Raw])) as $seen
              | map(select(([.DetectorName, .Raw] | IN($seen[])) | not)) | .[]
            ' advisory_all.json > advisory.json 2>/dev/null || cp advisory_all.json advisory.json
          else
            cp advisory_all.json advisory.json
          fi

          rm -f all_findings.json git_raw.json fs_raw.json advisory_all.json
          printf "📊 Blocking findings (new commits): %s\n" "$(wc -l < blocking.json)"
          printf "📊 Advisory findings (pre-existing): %s\n" "$(wc -l < advisory.json)"

      - name: Report findings
        if: always()
        env:
          SHOW_KEYS: ${{ inputs.show_keys }}
        run: |
          set -uo pipefail

          # Location fields differ between the git and filesystem sources.
          LOCATION='(.SourceMetadata.Data.Git.file // .SourceMetadata.Data.Filesystem.file // "unknown location")'
          COMMIT='(.SourceMetadata.Data.Git.commit // "" | if . == "" then "" else " (Commit: " + .[0:8] + ")" end)'

          render() {
            if [ "$SHOW_KEYS" = "true" ]; then
              jq -r ".DetectorName + \" in \" + $LOCATION + $COMMIT + \": \" + (.Raw // \"\")" "$1" \
                || echo "Could not parse findings for display"
            else
              jq -r ".DetectorName + \" in \" + $LOCATION + $COMMIT" "$1" \
                || echo "Could not parse findings for display"
            fi
          }

          BLOCKING=$(wc -l < blocking.json)
          ADVISORY=$(wc -l < advisory.json)

          if [ "$BLOCKING" -gt 0 ]; then
            echo "🚨 SECRETS INTRODUCED BY THIS PUSH 🚨"
            printf "TruffleHog detected %d new credential(s).\n\n" "$BLOCKING"
            echo "IMMEDIATE ACTION REQUIRED:"
            echo "1. 🔄 Rotate every detected key/secret now - once pushed, treat them as compromised"
            echo "2. 🧹 Remove them from the code and move them to secrets management"
            echo "3. 📝 Remember that rewriting history does not un-leak a pushed credential"
            echo ""
            echo "🔑 New findings (these block the build):"
            echo "================================"
            render blocking.json
            echo "================================"
          else
            echo "✅ No new secrets introduced by this push"
          fi

          if [ "$ADVISORY" -gt 0 ]; then
            echo ""
            printf "ℹ️  %d pre-existing finding(s) elsewhere in the working tree.\n" "$ADVISORY"
            echo "   These do NOT block the build - this push did not introduce them."
            echo "   If already rotated, the leftover string can be cleaned up separately,"
            echo "   or added to ignore_keys."
            echo "--------------------------------"
            render advisory.json
            echo "--------------------------------"
            echo "::warning title=Pre-existing secrets::$ADVISORY finding(s) already in the working tree. Not introduced by this push, so not blocking."
          fi

          if [ "$SHOW_KEYS" != "true" ] && { [ "$BLOCKING" -gt 0 ] || [ "$ADVISORY" -gt 0 ]; }; then
            echo ""
            echo "ℹ️  Key values are hidden. Set show_keys: true to display them."
          fi

          {
            if [ "$BLOCKING" -gt 0 ]; then
              echo "## 🚨 Secret scan: $BLOCKING new finding(s)"
              echo ""
              echo "Introduced by this push. Rotate the affected credentials immediately."
            else
              echo "## ✅ Secret scan: no new secrets"
            fi
            if [ "$ADVISORY" -gt 0 ]; then
              echo ""
              echo "_Plus $ADVISORY pre-existing finding(s) in the working tree (advisory, not blocking)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Security Alert to Webhook
        if: always() && inputs.notify_webhook
        continue-on-error: true
        env:
          SECURITY_WEBHOOK_URL: ${{ secrets.webhook_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # Only alert on secrets this push introduced. Paging on
          # pre-existing findings would re-fire on every single build.
          if [ ! -s blocking.json ]; then
            echo "No new secrets detected - skipping webhook notification"
            exit 0
          fi

          case "${SECURITY_WEBHOOK_URL:-}" in
            http://*|https://*) ;;
            *) echo "ℹ️ No valid webhook URL - skipping notification"; exit 0 ;;
          esac

          # Never send the secret itself to a third-party endpoint.
          jq -c '. + {Raw: "***REDACTED***", RawV2: "***REDACTED***"}' blocking.json > sanitized.json

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg workflow_run_url "$RUN_URL" \
            --argjson secrets_count "$(wc -l < blocking.json)" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile findings sanitized.json \
            '{repository: $repository, branch: $branch, commit: $commit, actor: $actor,
              workflow_run_url: $workflow_run_url, secrets_count: $secrets_count,
              timestamp: $timestamp, findings: $findings}' > payload.json

          if curl -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Security-Scanner/1.0" \
            -d @payload.json "$SECURITY_WEBHOOK_URL" \
            --max-time 30 --retry 2 --retry-delay 5 \
            --fail-with-body --silent --show-error; then
            echo "✅ Security alert sent"
          else
            echo "❌ Failed to send security alert (exit $?)"
          fi

          rm -f payload.json sanitized.json

      # Blocks only on secrets introduced by the commits being pushed.
      # Pre-existing findings are advisory: a PR cannot fix a secret it did
      # not add, and a rotated key usually leaves its old string in the file,
      # so blocking on those would wedge every future PR forever.
      # Reuses the findings already computed rather than re-scanning.
      - name: Fail on new secrets
        if: always()
        run: |
          set -uo pipefail
          COUNT=$(wc -l < blocking.json 2>/dev/null || echo 0)
          rm -f blocking.json advisory.json
          if [ "$COUNT" -gt 0 ]; then
            printf "🚨 FAILING BUILD: %s secret(s) introduced by this push\n" "$COUNT"
            exit 1
          fi
          echo "✅ No new secrets - build can proceed"

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [validate-inputs, secret-scan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check scan results
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          VALIDATE_RESULT: ${{ needs.validate-inputs.result }}
        run: |
          if [ "$VALIDATE_RESULT" = "failure" ]; then
            echo "❌ Build blocked: input validation failed"
            exit 1
          fi

          if [ "$SECRET_SCAN_RESULT" != "success" ]; then
            echo "❌ Build blocked: secret scan result was '$SECRET_SCAN_RESULT'"
            echo "   (a failed or errored scan blocks too - an unrun scan is not a pass)"
            exit 1
          fi

          echo "✅ No secrets detected - build is secure"
